# 知识探索卡片系统 — 生产 nginx 配置(Task 36 / 02 §10.1)
#
# 职责:静态前端 + /api 反代 :8080 + /s/* Accept 区分 + 生产禁用 swagger + 限流 + gzip
#
# ★ /s/* Accept 区分(Phase 7 终审部署清单钉子,与 frontend/apps/explorer/vite.config.ts
#   的 dev proxy bypass 同构,生产必须同样成立):
#   - 浏览器导航 GET /s/{token}(Accept 含 text/html)→ rewrite 到 /index.html,
#     SPA vue-router 路由 /s/:token 接管 → ShareView 渲染分享页;
#   - 页内 fetch GET /s/{token} / POST /s/{token}/continue(ShareView 的 rawRequest
#     未设 Accept,fetch 默认 Accept: */*,不含 text/html)→ 放行上游 :8080 返回 JSON。
#   - 验收:同一 /s/{token} 路径,HTML 导航与 fetch JSON 均正确解析(见 docs/上线检查单.md)。

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;
    server_tokens  off;

    # ---- gzip(文本类响应压缩;分享页 JSON 也受益)----
    gzip              on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_vary         on;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/manifest+json image/svg+xml;

    # ---- 限流(简单 limit_req;按客户端 IP)----
    # /api:每 IP 10 r/s,突发 20(LLM 护栏之外的第一道闸,防脚本刷接口)
    limit_req_zone  $binary_remote_addr  zone=api:10m    rate=10r/s;
    # /s/*:每 IP 5 r/s,突发 10(免登录分享读,更保守)
    limit_req_zone  $binary_remote_addr  zone=share:10m  rate=5r/s;

    # 上游:compose 网络内 app 服务(:8080)
    upstream ke_app {
        server app:8080;
        keepalive 32;
    }

    # 公共安全头(两 server 共用,放在 include 片段亦可;MVP 单文件直书)
    # 注:add_header 在 location 内会覆盖 server 级,故各 location 单独需要的写在 location 里。

    # =====================================================================
    # 公众端(explorer SPA):80
    # =====================================================================
    server {
        listen      80;
        server_name _;

        # 前端 dist 挂载根(ops/build-frontend.sh 组装:explorer/ 与 workbench/ 两个 SPA 子目录)
        root  /usr/share/nginx/html/explorer;
        index index.html;

        # 容器自检端点(healthcheck 用,不计日志)
        location = /healthz {
            access_log off;
            return 200 'ok';
        }

        # 内容哈希文件名的构建产物:长缓存(单条 Cache-Control,expires 会重复下发)
        location /assets/ {
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header X-Content-Type-Options nosniff;
        }

        # API 反代(含认证面全部业务接口)
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://ke_app;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            # LLM 调用护栏 ke.agent.llm-timeout-seconds=60,反代留余量
            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    75s;
            client_max_body_size  2m;
        }

        # 分享端点(免登录):Accept 区分——导航回 SPA,fetch JSON 放行上游
        location /s/ {
            limit_req zone=share burst=10 nodelay;

            # Accept 含 text/html(浏览器导航)→ SPA fallback,前端路由 /s/:token 接管
            if ($http_accept ~* text/html) {
                rewrite ^ /index.html last;
            }

            # 否则视为 API fetch(share 分享读/接续),直连上游
            proxy_pass http://ke_app;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            client_max_body_size  64k;
        }

        # swagger / OpenAPI 文档生产禁用(第一道:nginx 直接 404,不触上游;
        # 第二道:application-prod.yml springdoc enabled=false —— 双防线)
        location ~ ^/(swagger-ui(/.*)?|swagger-ui\.html|v3/api-docs(/.*)?)$ {
            return 404;
        }

        # index.html 不缓存(发版即生效)
        location = /index.html {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff;
        }

        # SPA fallback:explorer 用 createWebHistory,未知路径回 index.html 由路由接管
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # =====================================================================
    # 工作台(workbench SPA):8081 —— 独立端口,内测/运营用
    # 生产加固:改 listen 为内网 IP 或上游 LB 加 IP 白名单,不对公网开放
    # =====================================================================
    server {
        listen      8081;
        server_name _;

        root  /usr/share/nginx/html/workbench;
        index index.html;

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://ke_app;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    75s;
            client_max_body_size  10m;   # 工作台富文本/封面图上传余量
        }

        # 工作台不暴露 swagger(同上双防线)
        location ~ ^/(swagger-ui(/.*)?|swagger-ui\.html|v3/api-docs(/.*)?)$ {
            return 404;
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
