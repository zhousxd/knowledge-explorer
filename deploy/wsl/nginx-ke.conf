# 知识探索 · WSL 单 nginx 双上下文站点(listen 8081)
# 安装: sudo cp 本文件 /etc/nginx/sites-available/ke.conf && sudo ln -sf 到 sites-enabled && nginx -t && reload
#
# /app/        探索端 SPA(vite --base=/app/ 构建)
# /workbench/  工作台 SPA(vite --base=/workbench/ 构建)
# /api/        Spring Boot(127.0.0.1:8090,prod profile);配图 /api/images 亦走此
# /s/{token}   免登录分享:HTML 导航 308 归一到 /app/s/…(路由 base 一致),fetch 的 JSON 直代理后端
# /            一律去探索端

server {
    listen 8081;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 5MB 配图限额 + multipart 开销(spring.servlet.multipart.max-file-size=5MB 同步)
    client_max_body_size 6m;

    # ---- 探索端 ----
    location /app/ {
        alias /home/zsx/workspace/knowledge-explorer/www/app/;
        try_files $uri $uri/ /app/index.html;
    }
    location = /app { return 308 /app/; }

    # ---- 工作台 ----
    location /workbench/ {
        alias /home/zsx/workspace/knowledge-explorer/www/workbench/;
        try_files $uri $uri/ /workbench/index.html;
    }
    location = /workbench { return 308 /workbench/; }

    # ---- 免登录分享(探索端路由 /app/s/:token;API 在根 /s/) ----
    # 判别器用 Sec-Fetch-Dest:地址栏/链接导航 = document,fetch/XHR = empty。
    # 不能用 Accept 嗅探:部分内核(如 Electron)的 fetch 默认 Accept 也含 text/html,
    # 会把 API 请求误 308 到 SPA,页面拿到 index.html 报「服务异常」。
    location /s/ {
        if ($http_sec_fetch_dest = document) { return 302 /app$request_uri; }
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- 后端 API ----
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = / { return 308 /app/; }
}
