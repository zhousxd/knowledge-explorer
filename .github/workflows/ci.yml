name: ci
on:
  push:
    branches: [master, 'feat/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # 集成测试直连 localhost:5432（无 Testcontainers），用 services 起真实 PG16/Redis
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ke_test
          POSTGRES_USER: ke
          POSTGRES_PASSWORD: ke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        command: redis-server --requirepass redis-ci-pass
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: ./mvnw -B -ntp verify
        env:
          KE_REDIS_PASSWORD: redis-ci-pass
          KE_JWT_SECRET: ci-secret-key-32-bytes!!ci-only!!!!
          SPRING_AI_OPENAI_API_KEY: dummy

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
