spring:
  application:
    name: knowledge-explorer
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 智能体执行参数（dev/test 共用；test profile 不覆盖即同值）
ke:
  agent:
    stale-seconds: 120
    recycle-interval-ms: 60000
    # 单次 LLM 调用超时秒数（FR-S13 护栏，Task 20 手写 future.get 等价实现）
    llm-timeout-seconds: 60
  quota:
    # 智能服务每日配额（FR-S04）：Redis INCR，超限 429
    daily-limit: 30

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
