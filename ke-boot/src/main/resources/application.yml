spring:
  application:
    name: knowledge-explorer
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # 卡片配图上传上限（二期图片功能）：ImageService 另有 5MB 双保险 + 魔数白名单
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 智能体执行参数（dev/test 共用；test profile 不覆盖即同值）
ke:
  agent:
    stale-seconds: 120
    recycle-interval-ms: 60000
    # 单次 LLM 调用超时秒数（FR-S13 护栏，Task 20 手写 future.get 等价实现）
    llm-timeout-seconds: 60
  quota:
    # 智能服务每日配额（FR-S04）：Redis INCR，超限 429
    daily-limit: 30
  upload:
    # 卡片配图本地存储根目录（二期图片功能·本地存储版）：文件按 {yyyy}/{MM}/{uuid}.{ext} 落盘。
    # 生产可用 KE_UPLOAD_DIR 指到挂载卷/数据盘；日后切 MinIO/OSS 仅替换本服务的存储实现
    dir: ${KE_UPLOAD_DIR:./data/uploads}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
