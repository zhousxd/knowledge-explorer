spring:
  application:
    name: knowledge-explorer
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 智能体执行参数（dev/test 共用；test profile 不覆盖即同值）
ke:
  agent:
    stale-seconds: 120
    recycle-interval-ms: 60000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
