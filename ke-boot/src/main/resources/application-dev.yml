spring:
  datasource:
    # stringtype=unspecified：JSONB 列（agent_run.input_json 等）以字符串参数写入，由 PG 推断类型
    url: jdbc:postgresql://localhost:5432/ke?stringtype=unspecified
    username: ke
    password: ke
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    openai:
      base-url: ${KE_LLM_BASE_URL:https://api.deepseek.com}
      api-key: ${KE_LLM_API_KEY:dummy}

ke:
  jwt:
    secret: ${KE_JWT_SECRET:dev-only-secret-key-32bytes!!dev-only!!}
    access-ttl: 2h
    refresh-ttl: 7d
  llm:
    generator-model: ${KE_LLM_GENERATOR:deepseek-chat}
    router-model: ${KE_LLM_ROUTER:deepseek-chat}
