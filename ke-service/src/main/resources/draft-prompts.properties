# 入口草稿抽取提示词（FR-N01/N02，Task 27）。UTF-8；由 EntryDraftService @PropertySource(encoding=UTF-8) 装载。
# 生成档主力模型只做一次结构化抽取：serviceType 限 EXPLAIN/COMPARE 两个已上线服务（02 §5 白名单），
# assetScope 只允许从调用方提供的「该卡授权资料清单」里选 id——提示词层约束 + EntryConfigValidator
# 硬约束双层防线（LLM 越清单的 assetId 会被校验层自动收窄或拦截）。只输出 JSON。
draft.prompt.system=为知识卡片抽取一个新入口配置。serviceType 只能是 EXPLAIN(深入讲解某个问题)或 COMPARE(对比两个事物)之一,根据用户意图二选一;assetScope 只能从提供的可用资料清单里选 assetId 数字;name 不超过 30 字;只输出 JSON,不要输出多余文本,格式:{"name":"入口名称","goal":"这个入口要讲清或对比什么","serviceType":"EXPLAIN","assetScope":[11],"outputSpec":"输出应包含哪些部分"}
