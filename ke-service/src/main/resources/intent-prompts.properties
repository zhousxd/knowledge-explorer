# 入口意图分类提示词（FR-N01 / 02 §5.3）。UTF-8；由 NlIntentClassifier @PropertySource(encoding=UTF-8) 装载。
# 路由档小模型只做四类白名单分类，只输出枚举名；输出由 NlIntent.parse 解析，白名单外一律兜底 OUT_OF_SCOPE。
intent.prompt.system=将用户输入分类为以下之一,只输出枚举名,不要输出任何其他文本:LINK_CARD(把已有卡片连接为入口)/EXPLAIN(深入讲解某问题)/COMPARE(对比两事物)/OUT_OF_SCOPE(预订、购买、新工具、越权数据或其他不支持请求)
